name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:

  # ============================================================
  # Linux
  # ============================================================

  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            linux-release-

      - name: Build
        run: |
          cargo build \
            --release \
            --target x86_64-unknown-linux-gnu

      - name: Prepare package
        run: |
          mkdir -p package/myradio

          cp target/x86_64-unknown-linux-gnu/release/myradio \
             package/myradio/

          cp README.md package/myradio/

          if [ -f LICENSE ]; then
            cp LICENSE package/myradio/
          fi

      - name: Create archive
        run: |
          tar \
            -czf myradio-linux-x86_64.tar.gz \
            -C package \
            myradio

      - name: Generate SHA256
        run: |
          sha256sum \
            myradio-linux-x86_64.tar.gz \
            > myradio-linux-x86_64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myradio-linux-x86_64
          path: |
            myradio-linux-x86_64.tar.gz
            myradio-linux-x86_64.tar.gz.sha256
          retention-days: 1


  # ============================================================
  # Windows
  # ============================================================

  build-windows:
    name: Windows x86_64
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-release-

      - name: Build
        run: |
          cargo build `
            --release `
            --target x86_64-pc-windows-msvc

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\myradio

          Copy-Item `
            target\x86_64-pc-windows-msvc\release\myradio.exe `
            package\myradio\

          Copy-Item README.md package\myradio\

          if (Test-Path LICENSE) {
            Copy-Item LICENSE package\myradio\
          }

      - name: Create archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path package\myradio\* `
            -DestinationPath myradio-windows-x86_64.zip

      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = Get-FileHash `
            myradio-windows-x86_64.zip `
            -Algorithm SHA256

          "$($hash.Hash.ToLower())  myradio-windows-x86_64.zip" |
            Out-File `
              -Encoding ascii `
              myradio-windows-x86_64.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myradio-windows-x86_64
          path: |
            myradio-windows-x86_64.zip
            myradio-windows-x86_64.zip.sha256
          retention-days: 1


  # ============================================================
  # macOS ARM64
  # ============================================================

  build-macos:
    name: macOS ARM64
    runs-on: macos-14

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-arm64-release-

      - name: Build
        run: |
          cargo build \
            --release \
            --target aarch64-apple-darwin

      - name: Prepare package
        run: |
          mkdir -p package/myradio

          cp target/aarch64-apple-darwin/release/myradio \
             package/myradio/

          cp README.md package/myradio/

          if [ -f LICENSE ]; then
            cp LICENSE package/myradio/
          fi

      - name: Create archive
        run: |
          tar \
            -czf myradio-macos-aarch64.tar.gz \
            -C package \
            myradio

      - name: Generate SHA256
        run: |
          shasum \
            -a 256 \
            myradio-macos-aarch64.tar.gz \
            > myradio-macos-aarch64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myradio-macos-aarch64
          path: |
            myradio-macos-aarch64.tar.gz
            myradio-macos-aarch64.tar.gz.sha256
          retention-days: 1


  # ============================================================
  # RELEASE
  # ============================================================

  release:
    name: Create GitHub Release
    needs:
      - build-linux
      - build-windows
      - build-macos

    runs-on: ubuntu-latest

    steps:

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: myradio-linux-x86_64
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: myradio-windows-x86_64
          path: release

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: myradio-macos-aarch64
          path: release

      - name: List release files
        run: |
          find release -type f -maxdepth 2 -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

          files: |
            release/myradio-linux-x86_64.tar.gz
            release/myradio-linux-x86_64.tar.gz.sha256

            release/myradio-windows-x86_64.zip
            release/myradio-windows-x86_64.zip.sha256

            release/myradio-macos-aarch64.tar.gz
            release/myradio-macos-aarch64.tar.gz.sha256
